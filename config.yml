match: >-
  ^%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}\s+\[%{DATA:logger}\]\s+\[pid=%{NUMBER:pid}\s+thread="%{DATA:thread}"\]\s+%{MULTILINE_DATA:message}$

patterns:
  MULTILINE_DATA: '[\s\S]*'

multiline:
  pattern: '^%{TIMESTAMP_ISO8601}'
  negate: true
  what: previous
  auto_flush_interval: 2
  max_lines: 500
  max_bytes: 10485760
  skip_newline: false
