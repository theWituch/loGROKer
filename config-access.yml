match: >-
  ^%{TIMESTAMP_ISO8601:timestamp}\s+%{LOGLEVEL:level}\s+\[%{DATA:logger}\]\s+\[pid=%{NUMBER:pid:int}\s+thread_id=%{NUMBER:thread_id:int}\s+thread_name="%{DATA:thread_name}"\]\s+request_id="%{DATA:request_id}"\s+client=%{QUOTEDSTRING:client}\s+method="%{DATA:method}"\s+target="%{DATA:message}"\s+protocol=%{QUOTEDSTRING:protocol}\s+status=(?:%{NUMBER:status:int}|-)\s+bytes=(?:%{NUMBER:bytes:int}|-)$

patterns:
  MULTILINE_DATA: '[\s\S]*'

multiline:
  pattern: '^%{TIMESTAMP_ISO8601}'
  negate: true
  what: previous
  auto_flush_interval: 2
  max_lines: 500
  max_bytes: 10485760
  skip_newline: false
